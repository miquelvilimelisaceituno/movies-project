@if (totalPages() > 1) {
  <nav class="pagination" [attr.aria-label]="texts.label">
    <button type="button" [disabled]="page() <= 1" (click)="pageChange.emit(page() - 1)">
      {{ texts.previous }}
    </button>

    <p class="current">{{ texts.page }} {{ page() }} {{ texts.of }} {{ totalPages() }}</p>

    <button type="button" [disabled]="page() >= totalPages()" (click)="pageChange.emit(page() + 1)">
      {{ texts.next }}
    </button>
  </nav>
}
